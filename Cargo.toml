[package]
name = "fluffy_fortnite"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
    "2d",
    "dynamic_linking",
] }
bevy-inspector-egui = "0.36.0"
bevy_asset_loader = { version = "0.26.0", features = ["2d", "progress_tracking"] }
bevy_common_assets = { version = "0.16.0", features = ["json", "toml"] }
bevy_ecs_tilemap = { version = "0.18.1", features = ["serde"] }
bevy_framepace = "0.21.0"
bevy_mod_debugdump = "0.15.0"
bevy_prototype_lyon = "0.16.0"
bevy_tweening = "0.15.0"
log = "0.4.32"
